name: Portal Manutencao Offline Windows
on:
  push:
    branches: ['desktop/offline-v1']
    paths: ['desktop/**', '.github/workflows/desktop-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de compilacao
        run: python -m pip install -r requirements.txt
      - name: Testar regras locais
        run: python -m unittest discover -s tests -v
      - name: Verificar telas no Windows
        run: python tests/smoke_ui.py
      - name: Verificar navegador incorporado
        run: python tests/smoke_embed.py
      - name: Gerar executavel independente
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name 10SulManutencao --hidden-import openpyxl --collect-all webview app.py
      - name: Verificar navegador do executavel empacotado
        run: |
          $env:SUL_PACKAGED_EXE = (Resolve-Path 'dist/10SulManutencao.exe').Path
          python tests/smoke_embed.py
      - name: Gerar instalador
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { choco install innosetup --no-progress -y }
          & $compiler installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testar aplicativo empacotado
        run: |
          $env:SUL_MANUTENCAO_DATA = Join-Path $env:RUNNER_TEMP '10sul-exe-smoke'
          $p = Start-Process dist/10SulManutencao.exe -PassThru
          Start-Sleep -Seconds 15
          $p.Refresh()
          if ($p.HasExited) { throw "Aplicativo encerrou inesperadamente" }
          if (!$p.MainWindowHandle) { throw "Aplicativo sem janela" }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        with:
          name: 10Sul_Manutencao_Integrado_1_1_1
          path: |
            desktop/output/*.exe
            desktop/dist/*.exe
            desktop/previews/*.png
            desktop/LEIA_ME.txt
          if-no-files-found: error
