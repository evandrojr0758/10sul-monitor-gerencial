name: Estoque de pneus - e-mail diário
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: estoque-pneus-email
  cancel-in-progress: false
jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/estoque-cocb
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir horário e enviar relatório
        env:
          PNEUS_GITHUB_TOKEN: ${{ secrets.PNEUS_GITHUB_TOKEN }}
          PNEUS_DATA_REPOSITORY: ${{ secrets.PNEUS_DATA_REPOSITORY }}
          PNEUS_DATA_BRANCH: ${{ secrets.PNEUS_DATA_BRANCH }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python enviar_pneus_diario.py
